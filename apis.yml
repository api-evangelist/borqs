name: Borqs
description: 'Borqs Technologies Inc. is a global Internet of Things (IoT) platform
  solution provider delivering customizable, differentiated and scalable smart-connected
  IoT software, hardware and cloud-service platforms. Founded in 2007, Borqs is a
  Google-licensed Android and Android Wear partner with R&D centers in the U.S., India
  and China, and debuted publicly on Nasdaq (BRQS) in August 2017. Its BorqsWare platform
  powers smartphones, tablets, wearables, in-vehicle infotainment (IVI), M2M and smart-appliance
  solutions, and in 2021 it expanded into solar and energy storage systems (ESS) via
  its Holu Hou Energy acquisition. Borqs is now a Sasken Group company. No public developer
  API, OpenAPI, or developer portal is published; this profile carries company identity
  and a live domain-security probe.'
